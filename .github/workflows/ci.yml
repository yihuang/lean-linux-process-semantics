name: build

on:
  push:
  pull_request:
  # Manual trigger for the one-off toolchain probes below (see `probe-muslcc`).
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (pinned by lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build library and run conformance checks
        run: ./scripts/check.sh

      - name: Build decoder CLI
        run: lake build decoder

  # The `build` job also checks the binaries → Lean direction: RwxFlagNs is in
  # the root module, so `scripts/check.sh`'s `lake build` runs `embedElf%` over
  # the committed ELFs and typechecks the proof stated about those images.
  # This job checks the other direction — sources → committed binaries.
  e2e:
    name: e2e (sources to committed ELF images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The C side of the example is built by the real GNU musl cross compiler,
      # taken from nixpkgs (shell.nix does the same for a local checkout); the
      # script has no fallback to another compiler.  The nixpkgs channel is the
      # source of truth for its version: the committed source binary is one
      # specific GNU musl build, so a different GCC version is expected to emit
      # a different program (same layout) — the script reports that as a warning,
      # not a failure.
      - name: Install nix (riscv64-linux-musl-gcc)
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # zig builds the RwxFlagNs target.  Pinned; the checksum is the one
      # https://ziglang.org/download/index.json publishes for this tarball.
      - name: Install zig 0.14.1
        run: |
          set -euo pipefail
          curl -sSfL "https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz" -o /tmp/zig.tar.xz
          echo "24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: zig version
        run: zig version

      # Rebuilds both programs from source and compares each with its committed
      # ELF at the loader level (tools/e2e/compare_elfs.py): segment extents and
      # permissions, entry point, derived AT_PHDR, and the bytes each PT_LOAD
      # takes from the file.  Layout drift fails for both sides; the target's
      # program bytes are also required to match (the section header table is
      # masked: the loader never reads it).  The source's program bytes are
      # reported but not gated here: its committed binary is one specific GNU
      # musl build, while the nixpkgs cross GCC is whatever the channel has, so
      # a codegen difference is expected and is a warning.  A `--strict-bytes`
      # run on a host with the exact compiler is the byte-level gate.
      - name: Rebuild and compare the committed ELF images
        run: |
          nix shell nixpkgs#pkgsCross.riscv64-musl.stdenv.cc -c \
            bash tools/e2e/rwx_flag_ns.sh

  # ------------------------------------------------------------------------
  # A one-off probe, run from the Actions tab (`workflow_dispatch`), for the
  # question the source gate depends on: does the nixpkgs GNU musl compiler
  # reproduce the committed `program.src.elf`'s PROGRAM bytes?
  #
  # CI is x86_64-linux, where `pkgsCross.riscv64-musl` is a cached DOWNLOAD
  # (unlike on aarch64-darwin), so this is cheap.  It builds only the source
  # (`--only=source`, no zig) and requires the program bytes to match
  # (`--require-source-program`, section-table bookkeeping masked).
  #
  #   green -> the channel's GCC reproduces the program the proof walks, and
  #            the source gate can become the default (`--require-source-program`
  #            in the e2e job too);
  #   red   -> the committed binary came from some other GCC; the per-segment
  #            lines in the log say how far off, and `--update --update-source`
  #            re-baselines it (with the proof re-derivation that implies).
  #
  # (The 2021 musl.cc tarball is NOT a candidate for the upstream build:
  # `source/ldflags.txt` passes `-Wl,--no-warn-rwx-segments`, which binutils
  # only accepts from 2.39 on, i.e. the original linker is 2023 or newer.)
  probe-source:
    name: probe (nixpkgs GCC vs committed source binary)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nix (riscv64-linux-musl-gcc)
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build only the source and require the program bytes to match
        run: |
          nix shell nixpkgs#pkgsCross.riscv64-musl.stdenv.cc -c \
            bash tools/e2e/rwx_flag_ns.sh --only=source --require-source-program
